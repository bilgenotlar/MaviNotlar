<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satır Arası | MaviBlue MaviNotlar</title>
    <style>
        /* TEMA PALETLERİ */
        /* Koyu (Varsayılan) */
        :root, [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #242424;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #5c8a8a;
            --accent-hover: #4a7070;
            --quote-color: #d4c4a8;
            --border: #333;
            --tag-bg: #333;
            --input-bg: #1e1e1e;
        }

        /* Açık */
        [data-theme="light"] {
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --text-main: #3f3f46;
            --text-muted: #71717a;
            --accent: #0f766e;
            --accent-hover: #115e59;
            --quote-color: #9a3412;
            --border: #e4e4e7;
            --tag-bg: #e4e4e7;
            --input-bg: #ffffff;
        }

        /* Modern */
        [data-theme="modern"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --quote-color: #38bdf8;
            --border: #334155;
            --tag-bg: #334155;
            --input-bg: #0f172a;
        }

        /* Minimalist */
        [data-theme="minimalist"] {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --accent: #000000;
            --accent-hover: #333333;
            --quote-color: #000000;
            --border: #e0e0e0; 
            --tag-bg: #f5f5f5;
            --input-bg: #fafafa;
        }

        /* GENEL STİLLER */
        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* MaviBlue Proje Alt Başlığı */
        .header-titles {
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        .project-subtitle {
            font-size: 0.65rem; 
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            font-weight: 600;
            text-align: center; 
        }

        h1 {
            font-weight: 300;
            letter-spacing: 1px;
            margin: 0;
            color: var(--accent);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        select.theme-selector {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        button.secondary:hover { background: rgba(128,128,128,0.1); }

        /* FİLTRE ÇUBUĞU */
        #active-filter-banner {
            display: none;
            background: var(--accent);
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 2rem;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        #active-filter-banner button {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
        }

        /* KART STİLLERİ */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .quote-section {
            font-family: "Georgia", serif;
            font-size: 1.4rem;
            font-style: italic;
            color: var(--quote-color);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .meta-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .tag:hover { opacity: 0.8; }

        .book-tag { background: transparent; border: 1px solid var(--border); }
        .book-tag:hover { background: rgba(128,128,128,0.1); }
        
        .author-tag { color: #fff; background: #2a3f3f; }
        [data-theme="light"] .author-tag { background: #0f766e; }
        [data-theme="modern"] .author-tag { background: #4f46e5; }
        [data-theme="minimalist"] .author-tag { background: #111; color: #fff; }

        .date-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            margin-top: 3px;
        }

        .analysis-block {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border);
        }

        .analysis-title {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .content-text {
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }

        /* Modal Stilleri */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }
        .modal h2 { margin-top: 0; color: var(--accent); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        input[type="text"], textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { resize: vertical; min-height: 80px; }
        .textarea-large { min-height: 120px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2rem; }
        .help-text { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-titles">
                    <div class="project-subtitle">MaviBlue Stüdyo MaviNotlar Projesi</div>
                    <h1 onclick="clearFilter()" title="Ana Sayfaya Dön">Satır Arası</h1>
                </div>
                <div class="btn-group">
                    <select class="theme-selector" id="themeSelect" onchange="changeTheme()">
                        <option value="dark">Koyu Tema</option>
                        <option value="light">Açık Tema</option>
                        <option value="modern">Modern Tema</option>
                        <option value="minimalist">Minimalist</option>
                    </select>
                    <button class="secondary" onclick="exportJSON()">JSON İndir</button>
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
                    <button class="secondary" onclick="document.getElementById('importFile').click()">JSON Yükle (Birleştir)</button>
                    <button onclick="openModal()">+ Yeni Ekle</button>
                </div>
            </div>
        </header>

        <div id="active-filter-banner">
            <span id="filter-text">Filtre aktif</span>
            <button onclick="clearFilter()">Temizle ✖</button>
        </div>

        <div id="feed"></div>
    </div>

    <!-- Yeni Kayıt Modalı -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Yeni Alıntı ve Not Ekle</h2>
            <form id="entryForm" onsubmit="saveEntry(event)">
                <div class="form-group">
                    <label>A. Alıntı *</label>
                    <textarea id="f_quote" class="textarea-large" required></textarea>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>B. Eser Adı *</label>
                        <input type="text" id="f_book" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>C. Yazar(lar) *</label>
                        <input type="text" id="f_author" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>D. Etiketler</label>
                    <input type="text" id="f_tags" placeholder="Örn: Zaman, Modernleşme (Virgülle ayırın)">
                    <div class="help-text">Maksimum 5 etiket girilebilir.</div>
                </div>
                <div class="form-group">
                    <label>E. NotebookLM / Dış Kaynak Notları</label>
                    <textarea id="f_notebooklm"></textarea>
                </div>
                <div class="form-group">
                    <label>F. Kişisel Düşüncelerim</label>
                    <textarea id="f_personal"></textarea>
                </div>
                <div class="form-group">
                    <label>G. Diğer Eklemeler (Bağlam vb.)</label>
                    <textarea id="f_other"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="secondary" onclick="closeModal()">İptal</button>
                    <button type="submit">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let entries = [];
        let currentFilter = null; 

        function changeTheme() {
            const theme = document.getElementById('themeSelect').value;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('satirArasiTheme', theme);
        }

        const savedTheme = localStorage.getItem('satirArasiTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeSelect').value = savedTheme;

        fetch('okuma-notlari.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON bulunamadı");
                return response.json();
            })
            .then(data => {
                entries = data;
                saveDataLocally(); 
                renderFeed();
            })
            .catch(error => {
                console.log("Dış JSON bulunamadı, tarayıcı hafızası kullanılıyor.");
                entries = JSON.parse(localStorage.getItem('satirArasiData')) || [
                    {
                        quote: "Saatin kendisi mekân, yürüyüşü zaman, ayarı insandır... Bu da gösterir ki, zaman ve mekân, insanla mevcuttur!",
                        book: "Saatleri Ayarlama Enstitüsü",
                        author: "Ahmet Hamdi Tanpınar",
                        tags: ["Zaman Felsefesi", "Modernleşme", "İroni"],
                        notes_notebooklm: "Tanpınar, bu cümlede Bergsoncu zaman algısını ve Osmanlı'dan Cumhuriyet'e geçişteki 'ayar' (modernleşme/düzen) ihtiyacını özetler.",
                        notes_personal: "Bazen kendi hayatımı da sürekli bir 'ayar' verme çabası olarak görüyorum.",
                        notes_other: "Romanın birinci bölümünde geçer.",
                        date: new Date().toLocaleDateString('tr-TR')
                    }
                ];
                renderFeed();
            });

        function applyFilter(type, value) {
            currentFilter = { type, value };
            renderFeed();
        }

        function clearFilter() {
            currentFilter = null;
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            const banner = document.getElementById('active-filter-banner');
            const filterText = document.getElementById('filter-text');
            feed.innerHTML = '';

            let listToRender = entries;
            
            if (currentFilter) {
                banner.style.display = 'flex';
                // Filtrelemeyi yapıyoruz
                if (currentFilter.type === 'author') {
                    listToRender = entries.filter(e => e.author === currentFilter.value);
                    filterText.innerText = `${listToRender.length} Alıntı Filtrelendi: Yazar - ${currentFilter.value}`;
                } else if (currentFilter.type === 'tag') {
                    listToRender = entries.filter(e => e.tags && e.tags.includes(currentFilter.value));
                    filterText.innerText = `${listToRender.length} Alıntı Filtrelendi: Etiket - ${currentFilter.value}`;
                } else if (currentFilter.type === 'book') {
                    listToRender = entries.filter(e => e.book === currentFilter.value);
                    filterText.innerText = `${listToRender.length} Alıntı Filtrelendi: Eser - ${currentFilter.value}`;
                }
            } else {
                banner.style.display = 'none';
            }

            if (listToRender.length === 0) {
                feed.innerHTML = `<p style="text-align:center; color:var(--text-muted);">Bu filtreye uygun kayıt bulunamadı.</p>`;
                return;
            }

            listToRender.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const tagsHtml = (entry.tags || []).map(tag => 
                    `<span class="tag" onclick="applyFilter('tag', '${tag}')">${tag}</span>`
                ).join('');
                
                let notesHtml = '';
                if (entry.notes_notebooklm || entry.notes_personal || entry.notes_other) {
                    notesHtml += `<div class="analysis-block">`;
                    
                    if (entry.notes_notebooklm) {
                        notesHtml += `<div class="analysis-title">NotebookLM / Dış Kaynak Notları</div>
                                      <div class="content-text">${entry.notes_notebooklm.replace(/\n/g, '<br>')}</div>`;
                    }
                    if (entry.notes_personal) {
                        notesHtml += `<div class="analysis-title">Kişisel Düşüncelerim</div>
                                      <div class="content-text" style="opacity: 0.85; font-style: italic;">${entry.notes_personal.replace(/\n/g, '<br>')}</div>`;
                    }
                    if (entry.notes_other) {
                        notesHtml += `<div class="analysis-title">Diğer Eklemeler</div>
                                      <div class="content-text">${entry.notes_other.replace(/\n/g, '<br>')}</div>`;
                    }
                    notesHtml += `</div>`;
                }

                const dateStr = entry.date ? entry.date : "";

                card.innerHTML = `
                    <div class="quote-section">${entry.quote.replace(/\n/g, '<br>')}</div>
                    
                    <div class="meta-container">
                        <div class="meta-tags">
                            <span class="tag book-tag" onclick="applyFilter('book', '${entry.book}')" title="Bu eserin diğer alıntılarını gör">📖 ${entry.book}</span>
                            <span class="tag author-tag" onclick="applyFilter('author', '${entry.author}')" title="Bu yazarın diğer alıntılarını gör">✍️ ${entry.author}</span>
                            ${tagsHtml}
                        </div>
                        <div class="date-text" title="Eklenme Tarihi">${dateStr}</div>
                    </div>

                    ${notesHtml}
                `;
                feed.appendChild(card);
            });
        }

        function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('entryForm').reset(); }

        function sanitizeText(text) {
            if (!text) return "";
            return text
                .replace(/^[ \t]+/gm, '')      
                .replace(/\n{3,}/g, '\n\n')    
                .trim();                       
        }

        function saveEntry(e) {
            e.preventDefault();
            
            let rawTags = document.getElementById('f_tags').value;
            let processedTags = rawTags.split(',')
                .map(t => t.trim())
                .filter(t => t !== '')
                .slice(0, 5);

            const newEntry = {
                quote: sanitizeText(document.getElementById('f_quote').value),
                book: document.getElementById('f_book').value.trim(),
                author: document.getElementById('f_author').value.trim(),
                tags: processedTags,
                notes_notebooklm: sanitizeText(document.getElementById('f_notebooklm').value),
                notes_personal: sanitizeText(document.getElementById('f_personal').value),
                notes_other: sanitizeText(document.getElementById('f_other').value),
                date: new Date().toLocaleDateString('tr-TR')
            };

            entries.unshift(newEntry);
            saveDataLocally();
            clearFilter(); 
            closeModal();
        }

        function saveDataLocally() {
            localStorage.setItem('satirArasiData', JSON.stringify(entries));
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "okuma-notlari.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        let addedCount = 0;
                        
                        importedData.forEach(newEntry => {
                            const isDuplicate = entries.some(existingEntry => 
                                existingEntry.quote.trim().toLowerCase() === newEntry.quote.trim().toLowerCase()
                            );

                            if (!isDuplicate) {
                                if (!newEntry.date) {
                                    newEntry.date = new Date().toLocaleDateString('tr-TR');
                                }
                                entries.unshift(newEntry); 
                                addedCount++;
                            }
                        });

                        saveDataLocally();
                        renderFeed();
                        
                        if (addedCount > 0) {
                            alert(`${addedCount} adet YENİ alıntı başarıyla listenize eklendi!`);
                        } else {
                            alert("Yüklenen dosyadaki tüm alıntılar zaten listenizde mevcut. Yeni bir kayıt eklenmedi.");
                        }

                    } else { 
                        alert("Geçersiz JSON formatı."); 
                    }
                } catch (err) { 
                    alert("Dosya okunurken hata oluştu."); 
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
